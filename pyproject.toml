[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "memco"
version = "0.1.0"
description = "Edge-cloud memory for collaborative agents."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2"]
laya = ["laya"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
