<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MemCo · 端云记忆</title>
  <style>
    :root {
      --bg: #07080c;
      --ink: #efeae2;
      --mute: #8d877c;
      --gold: #ffe566;
      --blue: #58c4dd;
      --teal: #5cd0b3;
      --red: #fc6255;
      --green: #83c167;
      --pink: #e07a9a;
      --line: #2a2d36;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
      overflow: hidden;
    }
    .stage {
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .frame {
      flex: 1;
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 12px 24px 0;
    }
    svg.scene {
      width: min(100%, calc((100vh - 184px) * 16 / 9));
      max-height: calc(100vh - 184px);
      display: block;
    }
    .caption-wrap {
      height: 116px;
      display: grid;
      place-items: center;
      padding: 0 48px;
    }
    .caption {
      max-width: 1280px;
      text-align: center;
      font-size: 30px;
      font-weight: 300;
      letter-spacing: 0.05em;
      line-height: 1.65;
      word-break: keep-all;
      line-break: strict;
      text-wrap: pretty;
      color: var(--ink);
      min-height: 2.4em;
    }
    .caption em {
      color: var(--gold);
      font-style: normal;
      font-weight: 500;
    }
    .player {
      height: 56px;
      display: grid;
      grid-template-columns: auto auto 1fr auto auto;
      gap: 16px;
      align-items: center;
      padding: 0 28px 14px;
    }
    button.ctl {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid #3a3d46;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      display: grid;
      place-items: center;
    }
    button.ctl:hover { border-color: var(--gold); }
    button.ctl svg { width: 14px; height: 14px; }
    .bar {
      position: relative;
      height: 3px;
      background: #22252d;
      cursor: pointer;
      border-radius: 2px;
    }
    .bar > i {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0;
      background: var(--gold);
      border-radius: 2px;
    }
    .bar > b {
      position: absolute;
      top: 50%;
      width: 9px;
      height: 9px;
      margin: -4.5px 0 0 -4.5px;
      background: var(--gold);
      border-radius: 50%;
    }
    .time {
      font-size: 28px;
      letter-spacing: 0.1em;
      color: var(--mute);
      font-variant-numeric: tabular-nums;
      min-width: 168px;
      text-align: right;
    }
    .chapter {
      font-size: 28px;
      letter-spacing: 0.14em;
      color: var(--mute);
      white-space: nowrap;
      min-width: 12em;
    }
    .ghost { opacity: 0; }
  </style>
</head>

  <script>
    const DURATION = 170000;
    const CAPS = [
      [1800, 6000, "MemCo 是一套<em>端云协同</em>的智能体记忆系统。"],
      [6000, 18000, "记忆分置两端：端侧贴近用户，云侧承接更长期的保存。中间走 <em>MQTT</em>，投递语义由 <em>QoS</em> 约定。"],
      [18000, 28000, "端侧三块：<em>偏好</em>、<em>短期记忆</em>、<em>内化记忆</em>。偏好留在本地，随时可读。"],
      [28000, 38000, "云侧两块：<em>记忆缓存</em>与<em>长期记忆</em>。缓存按缓存策略保存整组排序结果；长期记忆用关键词与向量检索。"],
      [38000, 50000, "召回时，若是<em>偏好</em>问题，就在端侧本地完成，不必发 MQTT。"],
      [50000, 58000, "不是偏好，就先看<em>短期记忆</em>；没有，再经 <em>MQTT</em> 问云侧。"],
      [58000, 72000, "云侧<em>命中缓存</em>，就直接返回该组排序结果，并给对应的长期记忆做 <em>boost</em>。未命中，再查长期记忆与向量，把排好的整组写入缓存。"],
      [72000, 84000, "会话结束，这一轮才<em>写入短期记忆</em>。端侧<em>偏好</em>此时不动。"],
      [84000, 104000, "短期记忆达到容量，经 MQTT <em>归档</em>。成功后，这批短期记忆在端侧<em>永久删除</em>，以免与长期记忆重复。"],
      [104000, 112000, "云侧写入长期记忆，并<em>清空记忆缓存</em>；总结后的<em>偏好</em>经 MQTT 回传端侧。"],
      [112000, 122000, "稀缺样本在<em>云侧蒸馏</em>，端侧只<em>加载快照</em>。"],
      [122000, 140000, "若已达容量却碰上 <em>MQTT 断连</em>：写入之后，端侧对短期记忆等概率随机删除，以维持容量。召回只保留<em>偏好与短期记忆</em>。"],
      [140000, 156000, "长期记忆达到容量后<em>分层遗忘</em>：按权重分成若干档，档内等概率抽取，永久删除，并清理缓存、重建检索。"],
      [156000, 167500, "<em>MQTT 断连不是失败</em>。只有需要召回且结果为空，才记为<em>失败</em>。"]
    ];
    const CHAPS = [
      [0, "00  ·  引言"],

    const IND = [

    const $ = (id) => document.getElementById(id);
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const lerp = (a, b, t) => a + (b - a) * t;
    const ease = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

    function tween(t, a, b) {
      if (t <= a) return 0;
      if (t >= b) return 1;
      return ease((t - a) / (b - a));
    }
    function windowed(t, a, b, fade) {
      fade = fade == null ? 480 : fade;
      if (t <= a || t >= b) return 0;
      if (t < a + fade) return tween(t, a, a + fade);
      if (t > b - fade) return 1 - tween(t, b - fade, b);
      return 1;
    }
    function appear(t, a, b) {
      return tween(t, a, b);
    }
    function op(el, v, scale) {
      const o = clamp(v, 0, 1);
      el.style.opacity = String(o);
      if (scale != null) {
        const s = lerp(0.94, 1, o);
        const prev = el.getAttribute("data-tf") || "";
        el.setAttribute("transform", (prev + " scale(" + lerp(0.96, 1, o) + ")").trim());
      }
    }
    function setOp(el, v) {
      el.style.opacity = String(clamp(v, 0, 1));
    }

    ["edge-box","cloud-box","mqtt","mqtt-cut","m-pref","m-short","m-inner","m-cache","m-distill","m-long","indicate","token","sample","snap","fail","title","title-sub"].forEach((id) => {
      const el = $(id);
      if (el) el.style.opacity = "0";
    });
    ["tier0","tier1","tier3"].forEach((id) => { $(id).style.opacity = "0"; });

    const pkts = $("pkts");
    const pktShape = [
      { w: 8, h: 8, rx: 1.6 },
      { w: 6, h: 10, rx: 2 },
      { w: 11, h: 6, rx: 3 }
    ];
    for (let i = 0; i < 3; i++) {
      const c = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      c.setAttribute("width", String(pktShape[i].w));
      c.setAttribute("height", String(pktShape[i].h));
      c.setAttribute("rx", String(pktShape[i].rx));
      c.setAttribute("y", String(530 - pktShape[i].h / 2));
      pkts.appendChild(c);
    }
    const noteData = ["n0", "n1", "n2", "n3"].map((id) => {
      const el = $(id);
      el.style.opacity = "0";
      return el;
    });

    function capAt(t) {
      for (const row of CAPS) if (t >= row[0] && t < row[1]) return row[2];
      return "";
    }
    function chapAt(t) {
      let s = CHAPS[0][1];
      for (const row of CHAPS) if (t >= row[0]) s = row[1];
      return s;
    }

    function indicateAt(t) {
      let i = 0;
      while (i + 1 < IND.length && IND[i + 1].t <= t) i++;
      const a = IND[i];
      const b = IND[Math.min(i + 1, IND.length - 1)];
      if (a === b) return a;
      const dur = Math.min(520, Math.max(1, b.t - a.t));
      const start = b.t - dur;
      if (t < start) return a;
      const u = ease(clamp((t - start) / dur, 0, 1));
      return {
        x: lerp(a.x, b.x, u),
        y: lerp(a.y, b.y, u),
        w: lerp(a.w, b.w, u),
        h: lerp(a.h, b.h, u),
        r: lerp(a.r, b.r, u)
      };
    }

    function along(x1, y1, x2, y2, u) {
      const e = ease(clamp(u, 0, 1));
      return [lerp(x1, x2, e), lerp(y1, y2, e)];
    }

    function render(t) {
      $("cam").removeAttribute("transform");

      const titleOn = windowed(t, 0, 6500, 500) + windowed(t, 164000, 170000, 600);
      setOp($("title"), Math.min(1, titleOn));
      setOp($("title-sub"), windowed(t, 700, 6500, 400));
      const line = $("title-line");
      line.setAttribute("d", `M740 546h${440 * tween(t, 300, 1800)}`);

      const topo = appear(t, 6500, 9200);
      setOp($("edge-box"), topo);
      setOp($("cloud-box"), appear(t, 7600, 10200));
      const mqttUp = appear(t, 10200, 12800) * (1 - appear(t, 122000, 125000));
      setOp($("mqtt"), mqttUp * (t < 164000 ? 1 : 0));
      setOp($("mqtt-cut"), windowed(t, 122000, 140000, 400));

      const pk = pkts.children;
      const flow = mqttUp > 0.5 && t < 122000;
      setOp(pkts, flow ? 1 : 0);
      if (flow) {
        for (let i = 0; i < pk.length; i++) {
          const u = ((t / 1800) + i / pk.length) % 1;
          const w = pktShape[i].w;
          pk[i].setAttribute("x", String(868 + (184 - w) * u));
        }
      }

      const shown = t >= 6000 && t < 164000;
      const f = (
        t < 18000 ? "topo" :
        t < 21500 ? "pref" :
        t < 25000 ? "short" :
        t < 28000 ? "inner" :
        t < 33000 ? "cache" :
        t < 38000 ? "long" :
        t < 50000 ? "pref" :
        t < 56000 ? "short" :
        t < 62000 ? "mqtt" :
        t < 67000 ? "cache" :
        t < 68800 ? "long" :
        t < 72000 ? "cloud" :
        t < 84000 ? "short" :
        t < 94000 ? "mqtt" :
        t < 106000 ? "long" :
        t < 112000 ? "pref" :
        t < 117000 ? "distill" :
        t < 122000 ? "inner" :
        t < 128000 ? "mqtt" :
        t < 140000 ? "edge" :
        t < 156000 ? "long" :
        "fail"
      );
      const lit = (name) => f === "topo" || f === name || (f === "cloud" && (name === "cache" || name === "long")) || (f === "edge" && (name === "pref" || name === "short" || name === "inner"));
      function vis(el, on, name) {
        if (!on) { setOp(el, 0); return; }
        setOp(el, lit(name) || f === "topo" ? 1 : 0.38);
      }
      vis($("m-pref"), shown && t >= 18000, "pref");
      vis($("m-short"), shown && t >= 21500, "short");
      vis($("m-inner"), shown && t >= 25000, "inner");
      vis($("m-cache"), shown && t >= 28000, "cache");
      vis($("m-distill"), shown && t >= 112000, "distill");
      vis($("m-long"), shown && t >= 33000, "long");
      setOp($("edge-box"), shown ? 1 : 0);
      setOp($("cloud-box"), shown ? (f === "edge" ? 0.2 : 1) : 0);
      if (t < 10200) {
        setOp($("edge-box"), topo);
        setOp($("cloud-box"), appear(t, 7600, 10200));
      }
      if (f === "topo") {
        setOp($("m-pref"), 0);
        setOp($("m-short"), 0);
        setOp($("m-inner"), 0);
        setOp($("m-cache"), 0);
        setOp($("m-distill"), 0);
        setOp($("m-long"), 0);
      }

      const ind = indicateAt(t);
      const box = $("indicate");
      box.setAttribute("x", ind.x);
      box.setAttribute("y", ind.y);
      box.setAttribute("width", ind.w);
      box.setAttribute("height", ind.h);
      setOp(box, ind.r * (t > 6000 && t < 164000 ? 1 : 0));

      const fill = $("short-fill");
      const cap = $("short-cap");
      if (t >= 72000 && t < 94000) {
        const w = lerp(56, 420, clamp((t - 72000) / 10000, 0, 1));
        fill.setAttribute("width", String(w));
        cap.textContent = "容量";
        cap.setAttribute("fill", t > 82000 ? "#ffe566" : "#8d877c");
      } else if (t >= 94000 && t < 106000) {
        fill.setAttribute("width", String(lerp(420, 0, clamp((t - 94000) / 800, 0, 1))));
        cap.textContent = "容量";
        cap.setAttribute("fill", "#fc6255");
      } else if (t >= 122000 && t < 140000) {
        const capW = 420;
        const overW = 520;
        let w = capW;
        if (t < 125500) w = capW;
        else if (t < 128500) w = lerp(capW, overW, clamp((t - 125500) / 1800, 0, 1));
        else if (t < 133000) w = lerp(overW, capW, clamp((t - 128500) / 2200, 0, 1));
        else w = capW;
        fill.setAttribute("width", String(w));
        cap.textContent = "容量";
        cap.setAttribute("fill", w > capW + 0.5 ? "#fc6255" : "#ffe566");
      } else {
        fill.setAttribute("width", "120");
        cap.textContent = "容量";
        cap.setAttribute("fill", "#8d877c");
      }

      const tok = $("token");
      if (t >= 50000 && t < 72000) {
        setOp(tok, 1);
        let p;
        if (t < 55500) p = along(458, 640, 868, 530, (t - 50000) / 5500);
        else if (t < 59000) p = along(868, 530, 1052, 530, (t - 55500) / 3500);
        else if (t < 63500) p = along(1052, 530, 1462, 228, (t - 59000) / 4500);
        else if (t < 67800) p = along(1462, 228, 1462, 780, (t - 63500) / 4300);
        else p = [1462, 780];
        tok.setAttribute("transform", `translate(${p[0]} ${p[1]})`);
      } else setOp(tok, 0);

      const ltmFrom = [[1224, 760], [1300, 840], [1588, 760], [1664, 860]];
      const cacheTo = [[1130, 230], [1220, 240], [1304, 250], [1390, 242]];
        const stmFrom = [[220, 560], [330, 548], [420, 572], [510, 556]];
      const ltmTo = [[1224, 760], [1300, 840], [1588, 760], [1664, 860]];
      noteData.forEach((el, i) => {
        let x = 0, y = 0, o = 0;
        const place = (t0, dur, stagger, from, to) => {
          const u = clamp((t - t0 - stagger) / dur, 0, 1);
          if (t < t0 + stagger || u >= 1) return;
          const p = along(from[0], from[1], to[0], to[1], u);
          x = p[0]; y = p[1]; o = 1;
        };
        place(68800, 1500, i * 90, ltmFrom[i], cacheTo[i]);
        place(86000, 1200, i * 140, stmFrom[i], ltmTo[i]);
        el.style.opacity = String(o);
        el.setAttribute("transform", `translate(${x} ${y})`);
      });

      const samp = $("sample");
      if (t >= 112400 && t < 116200) {
        const u = clamp((t - 112400) / 1400, 0, 1);
        setOp(samp, u > 0 && u < 1 ? 1 : 0);
        const p = along(1462, 780, 1460, 442, u);
        samp.setAttribute("transform", `translate(${p[0]} ${p[1]})`);
      } else setOp(samp, 0);

      const snap = $("snap");
      if (t >= 117200 && t < 121000) {
        const u = clamp((t - 117200) / 1400, 0, 1);
        setOp(snap, u > 0 && u < 1 ? 1 : 0);
        let p;
        if (u < 0.45) p = along(960, 160, 960, 530, u / 0.45);
        else p = along(960, 530, 168, 948, (u - 0.45) / 0.55);
        snap.setAttribute("transform", `translate(${p[0]} ${p[1]})`);
      } else setOp(snap, 0);

      ["tier0", "tier1", "tier3"].forEach((id, i) => {
        const el = $(id);
        const on = appear(t, 33000 + i * 160, 35200 + i * 160) * (1 - appear(t, 164000, 167000));
        let fade = 1;
        if (id === "tier3" && t >= 148000 && t < 164000) fade = 0.32;
        el.style.opacity = String(on * fade);
      });

      setOp($("fail"), windowed(t, 156500, 164000, 360));
      setOp($("grid"), t > 6000 && t < 164000 ? 0.18 : 0.08);

      $("caption").innerHTML = capAt(t);
      $("chapter").textContent = chapAt(t);
      const p = t / DURATION;
      $("fill").style.width = (p * 100) + "%";
      $("knob").style.left = (p * 100) + "%";
      $("clock").textContent = fmt(t) + " / " + fmt(DURATION);
      $("ico-pause").style.display = playing && t < DURATION ? "block" : "none";
      $("ico-play").style.display = playing && t < DURATION ? "none" : "block";
    }

    function fmt(ms) {
      const s = Math.min(DURATION, Math.max(0, Math.floor(ms / 1000)));
      return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
    }

    let playing = true;
    let t = 0;
    const boot = new URLSearchParams(location.search);
    if (boot.has("t")) {
      t = Math.max(0, Number(boot.get("t")) * 1000) || 0;
      playing = boot.get("play") === "1";
    }
    let last = performance.now();
    function tick(now) {
      if (playing) t = Math.min(DURATION, t + (now - last));
      last = now;
      if (t >= DURATION) playing = false;
      render(t);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    function toggle() {
      if (t >= DURATION) { t = 0; playing = true; last = performance.now(); return; }
      playing = !playing;
      last = performance.now();
    }
    $("play").addEventListener("click", (e) => { e.stopPropagation(); toggle(); });
    $("replay").addEventListener("click", (e) => { e.stopPropagation(); t = 0; playing = true; last = performance.now(); });
    document.querySelector(".frame").addEventListener("click", toggle);
    $("bar").addEventListener("click", (e) => {
      const r = $("bar").getBoundingClientRect();
      t = clamp((e.clientX - r.left) / r.width, 0, 1) * DURATION;
      last = performance.now();
      render(t);
    });
    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") { e.preventDefault(); toggle(); }
      if (e.code === "ArrowRight") t = Math.min(DURATION, t + 4000);
      if (e.code === "ArrowLeft") t = Math.max(0, t - 4000);
    });
  </script>
</body>
</html>
